server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Attachments travel as base64 inside the JSON body, which inflates them by
    # ~33%. Nginx defaults to 1m, which rejected any upload over ~750 KB before
    # it ever reached the API. Keep this a little above the API's own 10mb
    # express.json ceiling so oversized bodies fail with the API's JSON error
    # rather than an nginx HTML 413.
    client_max_body_size 12m;

    # React Router — serve index.html for all non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Design/item media uploads (CAD & tech docs up to 25 MB, video up to 50 MB)
    # have their own 70mb parser on the API — the 12m ceiling above would cut
    # them off. Longest matching ^~ prefix wins, so these override /api/ below.
    location ^~ /api/v1/masters/document-upload {
        client_max_body_size 75m;
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /api/v1/masters/item-media {
        client_max_body_size 75m;
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy API requests → backend container
    location ^~ /api/ {
        proxy_pass         http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy uploaded files → backend container
    location ^~ /uploads/ {
        proxy_pass       http://api:5000/uploads/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
