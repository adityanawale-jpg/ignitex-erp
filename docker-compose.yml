services:

  # ── Redis (query/permission cache + rate-limit store) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ignitextaierp_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - erp_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── API (Node.js / Express / TypeScript) ─────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ignitextaierp_api
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      NODE_ENV:               production
      PORT:                   5000
      DATABASE_URL:           postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}
      DB_HOST:                ${DB_HOST}
      DB_PORT:                ${DB_PORT:-5432}
      DB_NAME:                ${DB_NAME}
      DB_USER:                ${DB_USER}
      DB_PASSWORD:            ${DB_PASSWORD}
      DB_POOL_MIN:            ${DB_POOL_MIN:-2}
      DB_POOL_MAX:            ${DB_POOL_MAX:-10}
      DB_SSL:                 ${DB_SSL:-false}
      JWT_SECRET:             ${JWT_SECRET}
      # Optional — set to pull DB_PASSWORD/JWT_SECRET from GCP Secret Manager
      # at startup instead of the plain values above (see README "Secrets").
      # Requires the VM's service account to have Secret Manager Secret
      # Accessor on those two secrets. Leave blank to keep using the values
      # above unchanged.
      GCP_PROJECT_ID:         ${GCP_PROJECT_ID:-}
      JWT_EXPIRES_IN:         ${JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS:          ${BCRYPT_ROUNDS:-10}
      CORS_ORIGIN:            ${CORS_ORIGIN}
      LOG_LEVEL:              ${LOG_LEVEL:-info}
      LOG_FILE:               logs/app.log
      RATE_LIMIT_WINDOW_MS:   ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX:         ${RATE_LIMIT_MAX:-100}
      REDIS_URL:              redis://redis:6379
      SMTP_HOST:              ${SMTP_HOST:-}
      SMTP_PORT:              ${SMTP_PORT:-587}
      SMTP_USER:              ${SMTP_USER:-}
      SMTP_PASS:              ${SMTP_PASS:-}
      SMTP_FROM:              ${SMTP_FROM:-}
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
    ports:
      - "5000:5000"
    networks:
      - erp_net

  # ── Frontend (React / Vite → Nginx) ──────────────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL:     /api/v1
        VITE_UPLOADS_BASE_URL: ""
        VITE_APP_NAME:         IgniteX.ai ERP
        VITE_APP_VERSION:      1.0.0
    container_name: ignitextaierp_app
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - erp_net

# ── Persistent Volumes ────────────────────────────────────────────────────────
volumes:
  api_uploads:
  api_logs:
  redis_data:

# ── Internal Network ──────────────────────────────────────────────────────────
networks:
  erp_net:
    driver: bridge
